<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · RAILDESIGN AI</title>
  <meta name="description" content="Log in to your dashboard.">
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="container">
    <section class="auth-wrap"><div class="card auth-card">
      <h1 style="font-size:1.8rem">Welcome back</h1>
      <p>Log in to your dashboard.</p>
      <form class="stack" data-api="/api/auth/login" data-redirect="/dashboard">
        <label>Email <input name="email" type="email" required autocomplete="email"></label>
        <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
        <button class="btn primary" type="submit">Log in</button>
        <div class="form-msg" role="status"></div>
      </form>
      <p class="muted" style="margin-top:14px"><a href="/forgot">Forgot password?</a> · New here? <a href="/signup">Create an account</a></p>
    </div></section>
  </main>
  <div id="site-footer"></div>
  <script src="/js/common.js"></script>
  
</body>
</html>
