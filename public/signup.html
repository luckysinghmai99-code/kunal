<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up · RAILDESIGN AI</title>
  <meta name="description" content="You get 50 starter tokens when you sign up.">
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="container">
    <section class="auth-wrap"><div class="card auth-card">
      <h1 style="font-size:1.8rem">Create your account</h1>
      <p>You get 50 starter tokens when you sign up.</p>
      <form class="stack" data-api="/api/auth/signup" data-redirect="/dashboard">
        <label>Name <input name="name" maxlength="80" autocomplete="name"></label>
        <label>Email <input name="email" type="email" required autocomplete="email"></label>
        <label>Password <input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
        <button class="btn primary" type="submit">Create account</button>
        <div class="form-msg" role="status"></div>
      </form>
      <p class="muted" style="font-size:.85rem">By signing up you agree to our <a href="/terms">Terms</a> and <a href="/privacy">Privacy Policy</a>.</p>
      <p class="muted" style="margin-top:14px"><a href="/login">Already have an account? Log in</a></p>
    </div></section>
  </main>
  <div id="site-footer"></div>
  <script src="/js/common.js"></script>
  
</body>
</html>
